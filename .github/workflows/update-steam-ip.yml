name: Update Steam SDR IP ranges

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-sdr-ip-ranges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate sing-box rule-set
        run: python3 scripts/generate_steam_ip.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- steam-ip.json; then
            echo "Steam SDR ranges have not changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-ip.json
          git commit -m "chore: update Steam SDR IP ranges"
          git push
